name: Top.gg Auto Vote

on:
  schedule:
    # 07:00 WIB = 00:00 UTC
    - cron: '0 0 * * *'
    # 19:00 WIB = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: manual
        type: string

concurrency:
  group: topgg-vote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      vote_status: ${{ steps.run_vote.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          sudo apt-get update
          sudo apt-get install -y xvfb
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo "No supported Chrome/Chromium executable found"; exit 1; }
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run vote
        id: run_vote
        env:
          TOKENS:                    ${{ secrets.TOKENS }}
          BOT_IDS:                   ${{ secrets.BOT_IDS }}
          TG_BOT_TOKEN:              ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:                ${{ secrets.TG_CHAT_ID }}
          SEND_ERROR_SCREENSHOTS:    ${{ secrets.SEND_ERROR_SCREENSHOTS }}
          TOPGG_COOKIES_JSON:        ${{ secrets.TOPGG_COOKIES_JSON }}
        run: |
          secret_dir="$(mktemp -d)"
          chmod 700 "$secret_dir"
          trap 'rm -rf "$secret_dir"' EXIT
          write_secret() {
            local name="$1"
            local value="$2"
            local path="$secret_dir/$name"
            printf '%s' "$value" > "$path"
            chmod 600 "$path"
            printf -v "${name}_FILE" '%s' "$path"
            export "${name}_FILE"
          }
          write_secret TOKENS "$TOKENS"
          write_secret TOPGG_COOKIES_JSON "$TOPGG_COOKIES_JSON"
          write_secret TG_BOT_TOKEN "$TG_BOT_TOKEN"
          write_secret TG_CHAT_ID "$TG_CHAT_ID"
          unset TOKENS TOPGG_COOKIES_JSON TG_BOT_TOKEN TG_CHAT_ID
          export NEXT_VOTE_STATE_FILE="$RUNNER_TEMP/next-vote.json"
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" python vote.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate cooldown schedule
        id: cooldown
        if: always()
        env:
          STATE_FILE: ${{ runner.temp }}/next-vote.json
        run: |
          if [ ! -f "$STATE_FILE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c 'import json, os; value=json.load(open(os.environ["STATE_FILE"], encoding="utf-8"))["next_vote_at"]; assert type(value) is int'
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload cooldown schedule
        if: steps.cooldown.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-vote
          path: ${{ runner.temp }}/next-vote.json
          if-no-files-found: error
          retention-days: 1

      - name: Apply vote result
        if: always()
        env:
          STATUS: ${{ steps.run_vote.outputs.status }}
        run: exit "${STATUS:-1}"

    continue-on-error: true

  verify-vote:
    needs: vote
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Apply vote result
        env:
          VOTE_STATUS: ${{ needs.vote.outputs.vote_status }}
        run: test "$VOTE_STATUS" = "0"

  cleanup:
    needs: vote
    if: always() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Configure cooldown scheduler
        id: scheduler
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          endpoint="repos/$REPOSITORY/actions/workflows/cooldown-retry.yml"
          artifact="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "next-vote" and .expired == false)] | first // empty')"
          artifact_id="$(jq -r '.id // empty' <<<"$artifact")"
          if [ -n "$artifact_id" ]; then
            state_dir="$(mktemp -d)"
            trap 'rm -rf "$state_dir"' EXIT
            gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > "$state_dir/state.zip"
            unzip -qq "$state_dir/state.zip" -d "$state_dir/unpacked"
            next_vote_at="$(jq -er 'if (keys == ["next_vote_at"]) and (.next_vote_at | type == "number") and (.next_vote_at | floor == .) then .next_vote_at else error("invalid cooldown state") end' "$state_dir/unpacked/next-vote.json")"
            gh api --method PUT "$endpoint/enable"
            echo "⏰ Cooldown scheduler enabled for epoch $next_vote_at"
          else
            state="$(gh api "$endpoint" --jq '.state')"
            if [ "$state" = "active" ]; then
              gh api --method PUT "$endpoint/disable"
              echo "⏰ No valid cooldown state — scheduler disabled"
            else
              echo "⏰ No valid cooldown state — scheduler already disabled"
            fi
          fi

      - name: Clear old repository workflow runs
        id: old-runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | .id')"
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 10 ]; then
              echo "Deleting old completed run: $run_id"
              gh run delete --repo="${{ github.repository }}" "$run_id"
            fi
          done
          echo "✅ Cleanup done — latest 10 completed repository runs kept."

      - name: Apply cleanup result
        if: steps.scheduler.outcome != 'success' || steps.old-runs.outcome != 'success'
        run: exit 1

  # Prevent GitHub from disabling scheduled workflows due to 60-day inactivity
  # Runs only on scheduled triggers (not manual dispatch)
  # Source: https://github.com/liskin/gh-workflow-keepalive
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1
