name: Top.gg Auto Vote

on:
  schedule:
    # 07:00 WIB = 00:00 UTC
    - cron: '0 0 * * *'
    # 19:00 WIB = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  vote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          sudo apt-get update
          sudo apt-get install -y xvfb
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN" || { echo "No supported Chrome/Chromium executable found"; exit 1; }
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run vote
        env:
          TOKENS:                    ${{ secrets.TOKENS }}
          BOT_IDS:                   ${{ secrets.BOT_IDS }}
          TG_BOT_TOKEN:              ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:                ${{ secrets.TG_CHAT_ID }}
          SEND_ERROR_SCREENSHOTS:    ${{ secrets.SEND_ERROR_SCREENSHOTS }}
          TOPGG_COOKIES_JSON:        ${{ secrets.TOPGG_COOKIES_JSON }}
        run: |
          secret_dir="$(mktemp -d)"
          chmod 700 "$secret_dir"
          trap 'rm -rf "$secret_dir"' EXIT
          write_secret() {
            local name="$1"
            local value="$2"
            local path="$secret_dir/$name"
            printf '%s' "$value" > "$path"
            chmod 600 "$path"
            printf -v "${name}_FILE" '%s' "$path"
            export "${name}_FILE"
          }
          write_secret TOKENS "$TOKENS"
          write_secret TOPGG_COOKIES_JSON "$TOPGG_COOKIES_JSON"
          write_secret TG_BOT_TOKEN "$TG_BOT_TOKEN"
          write_secret TG_CHAT_ID "$TG_CHAT_ID"
          unset TOKENS TOPGG_COOKIES_JSON TG_BOT_TOKEN TG_CHAT_ID
          xvfb-run -a -s "-screen 0 1280x720x24" python vote.py

  cleanup:
    needs: vote
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Clear old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --repo="${{ github.repository }}" --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 10 ]; then
              echo "Deleting old run: $run_id"
              gh run delete --repo="${{ github.repository }}" "$run_id" || true
            fi
          done
          echo "✅ Cleanup done — latest 10 runs kept."

  # Prevent GitHub from disabling scheduled workflows due to 60-day inactivity
  # Runs only on scheduled triggers (not manual dispatch)
  # Source: https://github.com/liskin/gh-workflow-keepalive
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1
